name: Publish Release

# Triggers:
#   - Push a version tag:  git tag v1.2.1 && git push --tags
#   - Or click "Run workflow" in the GitHub Actions tab
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to push the updated docs/ back to main

jobs:
  # Builds MSIX, fixes .appinstaller URIs to point at GitHub Pages,
  # then commits/pushes docs/ so the auto-installer endpoint is live.
  # Firebase web hosting is handled separately by firebase-hosting-merge.yml.
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        timeout-minutes: 10
        run: flutter pub get

      - name: Create local_secrets.json placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "assets/config" | Out-Null
          '{}' | Out-File -FilePath "assets/config/local_secrets.json" -Encoding utf8

      - name: Restore signing certificate
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.CERT_PFX_BASE64 }}")
          $certPath  = "$env:RUNNER_TEMP\cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          "CERT_PATH=$certPath" | Out-File $env:GITHUB_ENV -Append

      - name: Build, package and fix URIs
        timeout-minutes: 45
        shell: pwsh
        run: |
          .\publish.ps1 `
            -CertPath     "$env:CERT_PATH" `
            -CertPassword "${{ secrets.CERT_PASSWORD }}"

      - name: Upload MSIX to GitHub Release and repoint .appinstaller
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Derive version tag from pubspec.yaml  (e.g. "1.2.2" → "v1.2.2")
          $version = (Select-String -Path pubspec.yaml -Pattern "^version:\s*(.+)$").Matches[0].Groups[1].Value.Trim()
          $tag = "v$version"
          Write-Host "Version: $version   Tag: $tag" -ForegroundColor Cyan

          # Locate the MSIX that publish.ps1 placed in docs/versions/ (newest first, guards
          # against any stale files that survived the cleanup)
          $msixFile = Get-ChildItem "docs/versions" -Filter "*.msix" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msixFile) { throw "No MSIX found in docs/versions/ — did publish.ps1 succeed?" }
          Write-Host "MSIX: $($msixFile.Name)" -ForegroundColor Cyan

          # Create the GitHub Release if it doesn't already exist
          $null = gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo ${{ github.repository }} `
              --title "Release $tag" `
              --notes "Automated release $tag"
          }

          # Upload (or replace) the MSIX asset on the release
          gh release upload $tag $msixFile.FullName `
            --repo ${{ github.repository }} `
            --clobber
          Write-Host "Uploaded $($msixFile.Name) to GitHub Release $tag" -ForegroundColor Green

          # Rewrite the MainPackage Uri in .appinstaller to the GitHub Release download URL
          $releaseUri = "https://github.com/${{ github.repository }}/releases/download/$tag/$($msixFile.Name)"
          $appInstaller = Get-ChildItem "docs" -Filter "*.appinstaller" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($appInstaller) {
            $xml = Get-Content $appInstaller.FullName -Raw -Encoding UTF8
            $xml = $xml -replace '(?i)Uri="https://kwasiasante\.github\.io/[^"]*\.msix"', "Uri=`"$releaseUri`""
            Set-Content $appInstaller.FullName $xml -Encoding UTF8 -NoNewline
            Write-Host "Rewrote .appinstaller MainPackage Uri → $releaseUri" -ForegroundColor Green
          }

          # Remove the MSIX from docs/ — it is now on GitHub Releases, not git/LFS.
          # GitHub Pages would serve the 133-byte LFS pointer instead of the real binary.
          Remove-Item $msixFile.FullName
          $versionsDir = "docs/versions"
          if ((Get-ChildItem $versionsDir -ErrorAction SilentlyContinue | Measure-Object).Count -eq 0) {
            Remove-Item $versionsDir
          }

      - name: Commit and push docs/
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # Only commit if there are staged changes
          $staged = git diff --staged --name-only
          if ($staged) {
            git commit -m "chore: publish release [skip ci]"
            git push origin main
            Write-Host "Pushed updated docs/ to main" -ForegroundColor Green
          } else {
            Write-Host "No changes in docs/ — nothing to push."
          }

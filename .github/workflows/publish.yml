name: Publish Release

# Triggers:
#   - Push a version tag:  git tag v1.2.1 && git push --tags
#   - Or click "Run workflow" in the GitHub Actions tab
on:
  # push:
  #   branches:
  #     - main
  push:
    tags: ['v*']
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# SETUP CHECKLIST
# ─────────────────────────────────────────────────────────────────────────────
# Existing secrets (already configured):
#   CERT_PFX_BASE64              — Windows MSIX signing cert (base64)
#   CERT_PASSWORD                — Windows cert password
#   FIREBASE_SERVICE_ACCOUNT_... — Firebase hosting (used by firebase-hosting-merge.yml)
#
# New secrets to add (repo → Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64      — base64 of your .keystore/.jks file
#                                  Generate:  base64 -w 0 release.keystore | pbcopy
#                                  Windows:   [Convert]::ToBase64String([IO.File]::ReadAllBytes('release.keystore')) | clip
#   ANDROID_KEYSTORE_PASSWORD    — keystore password
#   ANDROID_KEY_ALIAS            — key alias (e.g. "upload")
#   ANDROID_KEY_PASSWORD         — key password
#
# One-time Android code setup (do this locally before first Android CI run):
#   1. Generate a keystore if you don't have one:
#        keytool -genkey -v -keystore release.keystore -alias upload \
#          -keyalg RSA -keysize 2048 -validity 10000
#   2. Edit android/app/build.gradle — add signing config (see README or Flutter docs)
#   3. Add android/key.properties to .gitignore
#
# macOS and Linux require NO signing setup for personal use.
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  contents: write

jobs:

  # ── Windows: MSIX → GitHub Release + .appinstaller on GitHub Pages ──────────
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        timeout-minutes: 10
        run: flutter pub get

      - name: Create .env
        shell: pwsh
        run: |
          "APP_MODE=client`nDEBUG_MODE=false`nAPI_BASE_URL=https://kwasi-utilitybills.duckdns.org`n" |
            Out-File -FilePath ".env" -Encoding utf8 -NoNewline

      - name: Restore signing certificate
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.CERT_PFX_BASE64 }}")
          $certPath  = "$env:RUNNER_TEMP\cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          "CERT_PATH=$certPath" | Out-File $env:GITHUB_ENV -Append

      - name: Build, package and fix URIs
        timeout-minutes: 45
        shell: pwsh
        run: |
          .\publish.ps1 `
            -CertPath     "$env:CERT_PATH" `
            -CertPassword "${{ secrets.CERT_PASSWORD }}"

      - name: Upload MSIX to GitHub Release and repoint .appinstaller
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $versionRaw = (Select-String -Path pubspec.yaml -Pattern "^version:\s*(.+)$").Matches[0].Groups[1].Value.Trim()
          $version = $versionRaw -replace '\+.*', ''
          $tag = "v$version"
          Write-Host "Version: $versionRaw   Tag: $tag" -ForegroundColor Cyan

          $msixFile = Get-ChildItem "gh-pages/versions" -Filter "*.msix" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msixFile) { throw "No MSIX found in gh-pages/versions/ — did publish.ps1 succeed?" }
          Write-Host "MSIX: $($msixFile.Name)" -ForegroundColor Cyan

          gh release create $tag --repo ${{ github.repository }} --title "Release $tag" --notes "Automated release $tag" 2>$null; $true

          gh release upload $tag $msixFile.FullName --repo ${{ github.repository }} --clobber
          Write-Host "Uploaded $($msixFile.Name) to GitHub Release $tag" -ForegroundColor Green

          $releaseUri = "https://github.com/${{ github.repository }}/releases/download/$tag/$($msixFile.Name)"
          $appInstaller = Get-ChildItem "gh-pages" -Filter "*.appinstaller" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($appInstaller) {
            $xml = Get-Content $appInstaller.FullName -Raw -Encoding UTF8
            $xml = $xml -replace '(?i)Uri="https://kwasiasante\.github\.io/[^"]*\.msix"', "Uri=`"$releaseUri`""
            Set-Content $appInstaller.FullName $xml -Encoding UTF8 -NoNewline
            Write-Host "Rewrote .appinstaller MainPackage Uri → $releaseUri" -ForegroundColor Green
          }

          Remove-Item $msixFile.FullName
          $versionsDir = "gh-pages/versions"
          if ((Get-ChildItem $versionsDir -ErrorAction SilentlyContinue | Measure-Object).Count -eq 0) {
            Remove-Item $versionsDir
          }

      - name: Build InnoSetup EXE installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $versionRaw = (Select-String -Path pubspec.yaml -Pattern "^version:\s*(.+)$").Matches[0].Groups[1].Value.Trim()
          $version = $versionRaw -replace '\+.*', ''
          $tag = "v$version"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "InnoSetup not found — installing via Chocolatey..." -ForegroundColor Yellow
            choco install innosetup -y --no-progress | Out-Null
          }

          $sourceDir  = (Resolve-Path "build\windows\x64\runner\Release").Path
          $outputDir  = (Get-Location).Path
          $outputFile = "utility_bills_manager-$version-setup"

          & $iscc `
            "/DMyAppVersion=$version" `
            "/DMyAppSourceDir=$sourceDir" `
            "/DMyAppOutputDir=$outputDir" `
            "/DMyAppOutputFilename=$outputFile" `
            "windows\installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "InnoSetup build failed (exit $LASTEXITCODE)" }

          $exeName = "$outputFile.exe"
          Write-Host "Built: $exeName" -ForegroundColor Green

          gh release upload $tag $exeName --repo ${{ github.repository }} --clobber
          Write-Host "Uploaded $exeName to $tag" -ForegroundColor Green

      - name: Install WiX v4 toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "4.*"
          if ($LASTEXITCODE -ne 0) { dotnet tool update --global wix --version "4.*" }
          # Persist dotnet tools dir to PATH for all subsequent steps
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append $env:GITHUB_PATH
          # Also make it active in this step's session
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          # Pin extension versions to match the installed WiX tool so NuGet
          # doesn't pull the latest (v7+) which is incompatible with v4
          $wixVersion = (wix --version).Trim()
          Write-Host "WiX tool version: $wixVersion"
          wix extension add "WixToolset.UI.wixext/$wixVersion"   --global
          if ($LASTEXITCODE -ne 0) { throw "Failed to add WixToolset.UI.wixext/$wixVersion" }
          wix extension add "WixToolset.Util.wixext/$wixVersion" --global
          if ($LASTEXITCODE -ne 0) { throw "Failed to add WixToolset.Util.wixext/$wixVersion" }
          Write-Host "WiX v4 toolset ready" -ForegroundColor Green

      - name: Build WiX MSI installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $versionRaw = (Select-String -Path pubspec.yaml -Pattern "^version:\s*(.+)$").Matches[0].Groups[1].Value.Trim()
          $version = $versionRaw -replace '\+.*', ''
          $tag = "v$version"

          $sourceDir = (Resolve-Path "build\windows\x64\runner\Release").Path
          $msiName   = "utility_bills_manager-$version-setup.msi"

          wix build "windows\installer\product.wxs" `
            -d "Version=$version" `
            -d "SourceDir=$sourceDir" `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -out $msiName
          if ($LASTEXITCODE -ne 0) { throw "WiX MSI build failed (exit $LASTEXITCODE)" }
          Write-Host "Built: $msiName" -ForegroundColor Green

          gh release upload $tag $msiName --repo ${{ github.repository }} --clobber
          Write-Host "Uploaded $msiName to $tag" -ForegroundColor Green

      - name: Commit and push gh-pages branch
        shell: pwsh
        run: |
          git -C gh-pages config user.name  "github-actions[bot]"
          git -C gh-pages config user.email "github-actions[bot]@users.noreply.github.com"
          git -C gh-pages add .
          $staged = git -C gh-pages diff --staged --name-only
          if ($staged) {
            git -C gh-pages commit -m "chore: publish release [skip ci]"
            git -C gh-pages push origin gh-pages
            Write-Host "Pushed updated gh-pages branch" -ForegroundColor Green
          } else {
            Write-Host "No changes in gh-pages — nothing to push."
          }

  # ── Android: APK → GitHub Release ───────────────────────────────────────────
  publish-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        timeout-minutes: 10
        run: flutter pub get

      - name: Create .env
        run: |
          printf 'APP_MODE=client\nDEBUG_MODE=false\nAPI_BASE_URL=https://kwasi-utilitybills.duckdns.org\n' > .env

      - name: Configure Android release signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" \
            > android/key.properties

      - name: Build APK
        timeout-minutes: 30
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          mv build/app/outputs/flutter-apk/app-release.apk \
             "utility_bills_manager-${VERSION}-android.apk"
          echo "APK_NAME=utility_bills_manager-${VERSION}-android.apk" >> $GITHUB_ENV

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          TAG="v${VERSION}"
          gh release create "$TAG" --repo ${{ github.repository }} \
            --title "Release $TAG" --notes "Automated release $TAG" 2>/dev/null || true
          gh release upload "$TAG" "$APK_NAME" \
            --repo ${{ github.repository }} --clobber

  # ── macOS: DMG → GitHub Release ─────────────────────────────────────────────
  publish-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        timeout-minutes: 10
        run: flutter pub get

      - name: Create .env
        run: |
          printf 'APP_MODE=client\nDEBUG_MODE=false\nAPI_BASE_URL=https://kwasi-utilitybills.duckdns.org\n' > .env

      - name: Install SQLite (use system lib, avoid CI download failure)
        run: brew install sqlite3

      - name: Build macOS
        timeout-minutes: 45
        run: |
          export SQLITE3_INCLUDE_DIR=$(brew --prefix sqlite3)/include
          export SQLITE3_LIB_DIR=$(brew --prefix sqlite3)/lib
          flutter build macos --release

      - name: Create DMG
        run: |
          APP_PATH=$(find "build/macos/Build/Products/Release" -maxdepth 1 -name "*.app" | head -1)
          echo "Found app: $APP_PATH"
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          DMG_NAME="utility_bills_manager-${VERSION}-macos.dmg"
          hdiutil create \
            -volname "Utility Bill Manager" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "$DMG_NAME"
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          TAG="v${VERSION}"
          gh release create "$TAG" --repo ${{ github.repository }} \
            --title "Release $TAG" --notes "Automated release $TAG" 2>/dev/null || true
          gh release upload "$TAG" "$DMG_NAME" \
            --repo ${{ github.repository }} --clobber

  # ── Linux: tar.gz bundle → GitHub Release ───────────────────────────────────
  publish-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            cmake \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            libsqlite3-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        timeout-minutes: 10
        run: flutter pub get

      - name: Create .env
        run: |
          printf 'APP_MODE=client\nDEBUG_MODE=false\nAPI_BASE_URL=https://kwasi-utilitybills.duckdns.org\n' > .env

      - name: Build Linux
        timeout-minutes: 30
        run: flutter build linux --release

      - name: Package as tar.gz
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          ARCHIVE="utility_bills_manager-${VERSION}-linux-x64.tar.gz"
          tar -czf "$ARCHIVE" -C build/linux/x64/release bundle/
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload tar.gz to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          TAG="v${VERSION}"
          gh release create "$TAG" --repo ${{ github.repository }} \
            --title "Release $TAG" --notes "Automated release $TAG" 2>/dev/null || true
          gh release upload "$TAG" "$ARCHIVE" \
            --repo ${{ github.repository }} --clobber

  # ── latest.json: stable URL the app polls to detect updates ─────────────────
  # Runs after all platform builds complete (succeeds or fails — not cancelled).
  publish-latest-json:
    needs: [publish-windows, publish-android, publish-macos, publish-linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate gh-pages/latest.json
        run: |
          VERSION_RAW=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION=$(echo "$VERSION_RAW" | sed 's/+.*//')
          BUILD=$(echo "$VERSION_RAW" | sed -n 's/.*+\([0-9]*\)$/\1/p')
          BUILD=${BUILD:-0}
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          MSIX_VERSION="${VERSION}.${BUILD}"

          jq -n \
            --arg  version      "$VERSION" \
            --argjson build      "$BUILD" \
            --arg  tag          "$TAG" \
            --arg  win_msix     "${BASE}/utility_bills_manager_${MSIX_VERSION}.msix" \
            --arg  win_exe      "${BASE}/utility_bills_manager-${VERSION}-setup.exe" \
            --arg  win_msi      "${BASE}/utility_bills_manager-${VERSION}-setup.msi" \
            --arg  android      "${BASE}/utility_bills_manager-${VERSION}-android.apk" \
            --arg  macos        "${BASE}/utility_bills_manager-${VERSION}-macos.dmg" \
            --arg  linux        "${BASE}/utility_bills_manager-${VERSION}-linux-x64.tar.gz" \
            '{version:$version,build:$build,tag:$tag,downloads:{windows_msix:$win_msix,windows_exe:$win_exe,windows_msi:$win_msi,android:$android,macos:$macos,linux:$linux}}' \
            > gh-pages/latest.json

          echo "Generated gh-pages/latest.json for ${TAG}:"
          cat gh-pages/latest.json

      - name: Commit and push gh-pages/latest.json
        run: |
          git -C gh-pages config user.name  "github-actions[bot]"
          git -C gh-pages config user.email "github-actions[bot]@users.noreply.github.com"
          git -C gh-pages add latest.json
          git -C gh-pages diff --staged --name-only | grep -q . \
            && git -C gh-pages commit -m "chore: update latest.json for $(grep '^version:' pubspec.yaml | sed 's/version: //') [skip ci]" \
            && git -C gh-pages push origin gh-pages \
            || echo "No changes to latest.json — nothing to push."
